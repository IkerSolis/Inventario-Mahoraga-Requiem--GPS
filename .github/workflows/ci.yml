name: CI - Inventarios Mahoraga (Backend)

on:
  push:
    branches: [ "main", "seguridad", "pruebas" ]
  pull_request:
    branches: [ "main", "seguridad", "pruebas" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm ci

      - name: Verificar estilo con ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Ejecutar pruebas automatizadas (node:test + Supertest)
        working-directory: ./backend
        run: npm test

